# Hält die Screenshots in der README aktuell. Erzeugt sie mit tests/screenshots.js neu und committet geänderte Bilder
# auf den Branch, auf dem der Lauf gestartet wurde. So sieht man sie im Pull Request und prüft sie mit.
#
# Wann es läuft:
# - in jedem Pull Request nach grünen Specs, aufgerufen aus pages.yml („Specs und Deploy“)
# - von Hand unter Actions → Screenshots → Run workflow, für einen beliebigen Branch
#
# Gut zu wissen:
# - Commits mit dem GITHUB_TOKEN starten keine weiteren Workflows. Es gibt keine Schleife, aber der Bot-Commit im
#   Pull Request hat auch keinen eigenen Haken der Specs. Er ändert nur Bilder in screenshots/.
# - Wurde der Branch während des Laufs weiter gepusht, schlägt der Push fehl. Der nächste Lauf holt es nach.
# - Nach einem Bot-Commit vor dem nächsten eigenen Push erst die Bilder holen (git pull).
name: Screenshots

on:
  workflow_call:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: screenshots-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      # im Pull Request den Branch selbst auschecken (nicht den Merge-Commit), damit der Commit dort landet
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chrome ist auf den GitHub-Runnern vorinstalliert (/usr/bin/google-chrome)
      - name: Screenshots erzeugen
        run: node tests/screenshots.js

      - name: Geänderte Screenshots committen
        run: |
          # status statt diff, damit auch neu hinzugekommene Bilder erkannt werden
          if [ -z "$(git status --porcelain -- screenshots)" ]; then echo "Screenshots sind aktuell."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Screenshots aktualisieren"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
