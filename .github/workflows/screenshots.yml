# Erzeugt die Screenshots für die README von Hand neu, für einen beliebigen Branch:
# Actions → Screenshots → Run workflow → Branch wählen. Geänderte Bilder werden auf diesen Branch committet.
# Im normalen Ablauf ist das nicht nötig: In jedem Pull Request erzeugt „Specs und Deploy“ (pages.yml) die Bilder
# nach grünen Specs automatisch.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chrome ist auf den GitHub-Runnern vorinstalliert (/usr/bin/google-chrome)
      - name: Screenshots erzeugen
        run: node tests/screenshots.js

      - name: Geänderte Screenshots committen
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # status statt diff, damit auch neu hinzugekommene Bilder erkannt werden
          if [ -z "$(git status --porcelain -- screenshots)" ]; then echo "Screenshots sind aktuell."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          git commit -m "Screenshots aktualisieren"
          git push origin "HEAD:refs/heads/$BRANCH"
