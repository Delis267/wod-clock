# Prüft wod-clock mit den Specs (tests/features) und veröffentlicht die App bei jedem Push auf main auf GitHub Pages.
# Bei Pull Requests wird nichts veröffentlicht. Dort laufen die Specs auf dem Stand nach dem Merge (Branch + aktueller
# main). Sind sie grün, werden aus genau diesem Stand die Screenshots für die README erzeugt und bei Änderungen auf
# den PR-Branch committet.
# Einmalig einstellen: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Specs und Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pro Pull Request zählt nur der neueste Lauf; Läufe auf main werden nie abgebrochen
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Schreibrecht nur für den Screenshot-Commit im Pull Request
    permissions:
      contents: write
    steps:
      # im Pull Request: Merge-Commit aus Branch und aktuellem main, also der Stand nach dem Merge
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chrome ist auf den GitHub-Runnern vorinstalliert (/usr/bin/google-chrome)
      - name: Akzeptanztests ausführen
        run: node tests/run.js --alle

      # Nur nach grünen Specs (ein roter Schritt bricht den Job ab) und nur für Branches in diesem Repository:
      # Bei PRs aus Forks darf der GITHUB_TOKEN nicht pushen.
      - name: Screenshots erzeugen
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: node tests/screenshots.js

      # Der Merge-Commit lässt sich nicht pushen. Deshalb: Bilder beiseitelegen, Branch auschecken, Bilder hinein,
      # nur bei Änderungen committen. Scheitert nur das (z. B. weil parallel gepusht wurde), bleibt der Job grün:
      # „test“ soll eindeutig für die Specs stehen. Der nächste Lauf holt es nach.
      # Commits mit dem GITHUB_TOKEN starten keine Workflows, es gibt also keine Schleife.
      - name: Screenshots auf den PR-Branch committen
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r screenshots/. "$tmp/"
          git fetch --depth=1 origin "refs/heads/$BRANCH"
          git checkout -f -B "$BRANCH" FETCH_HEAD
          rm -rf screenshots && mkdir screenshots && cp -r "$tmp/." screenshots/
          if [ -z "$(git status --porcelain -- screenshots)" ]; then echo "Screenshots sind aktuell."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          git commit -m "Screenshots aktualisieren"
          git push origin "HEAD:refs/heads/$BRANCH" || { echo "::warning::Screenshots konnten nicht gepusht werden (Branch wurde inzwischen geändert?). Der nächste Lauf holt es nach."; exit 1; }

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # ganze Historie, damit die Versionsnummer gezählt werden kann
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version = Major.Minor aus der Datei VERSION (von Hand) + Anzahl der Änderungen auf main seit der letzten
      # Änderung an VERSION (automatisch). VERSION 1.4 → 1.4.0, 1.4.1, 1.4.2 …; neue Minor/Major beginnt wieder bei 0.
      # --first-parent: zählt Merges und direkte Pushes auf main, nicht die einzelnen Commits eines Pull Requests.
      - name: Version bestimmen
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "$base" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::VERSION muss Major.Minor enthalten, z. B. 1.4 (ist: '$base')"; exit 1; }
          since="$(git log -1 --first-parent --format=%H -- VERSION)"
          patch="$(git rev-list --count --first-parent "$since..HEAD")"
          echo "APP_VERSION=$base.$patch" >> "$GITHUB_ENV"
          echo "Version $base.$patch"

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r icons css js _site/
          # Cache-Name = Version: jede Version hat ihren eigenen Cache, installierte Apps erkennen das Update sofort.
          # Die App zeigt ihn unter „Gespeichert“ als „Version 1.4.2“ an.
          sed -i "s/const CACHE = 'wod-clock-[^']*'/const CACHE = 'wod-clock-$APP_VERSION'/" _site/sw.js
          grep "const CACHE" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
