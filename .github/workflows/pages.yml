# Prüft wod-clock mit den Specs (tests/features) und veröffentlicht die App bei jedem Push auf main auf GitHub Pages.
# Bei Pull Requests laufen nur die Specs, es wird nichts veröffentlicht.
# Einmalig einstellen: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Specs und Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chrome ist auf den GitHub-Runnern vorinstalliert (/usr/bin/google-chrome)
      - name: Specs ausführen
        run: node tests/run.js --alle

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r icons css js _site/
          # Neue Cache-Version pro Commit, damit installierte Apps das Update sofort bekommen
          sed -i "s/const CACHE = 'wod-clock-[^']*'/const CACHE = 'wod-clock-${GITHUB_SHA::7}'/" _site/sw.js
          grep "const CACHE" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
