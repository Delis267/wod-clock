# Veröffentlicht wod-clock bei jedem Push auf main auf GitHub Pages.
# Einmalig einstellen: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r icons css js _site/
          # Neue Cache-Version pro Commit, damit installierte Apps das Update sofort bekommen
          sed -i "s/const CACHE = 'wod-clock-[^']*'/const CACHE = 'wod-clock-${GITHUB_SHA::7}'/" _site/sw.js
          grep "const CACHE" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
